<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation spéciale</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffe6e6,#ffd4d4);
    overflow:hidden;
}

.page{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    text-align:center;
}

/* Première page */

#page1{
    display:flex;
    justify-content: flex-start; 
    padding-top: 20px; /* Plus d'espace en haut */
}

#page2{
    display:none;
    background:linear-gradient(135deg,#2ecc71,#27ae60);
    color:white;
}

h1{
    font-size:clamp(24px,7vw,40px); /* Un poil plus petit sur mini écrans */
    margin-bottom:5px;
    z-index: 10; 
}

h2{
    font-size:clamp(18px,5vw,24px);
    font-weight:normal;
    margin-bottom:35px;
}

/* CORRECTION : Le message est stylisé pour être au-dessus et bien visible */
#message{
    min-height:30px;
    margin-top:5px;
    margin-bottom: 5px;
    font-size: clamp(16px, 4.5vw, 20px);
    color:#c0392b;
    font-weight:bold;
    max-width:90%;
    z-index: 10;
}

/* CORRECTION : Hauteur ajustée pour mobile pour ne pas écraser l'écran */
.zone{
    position:relative;
    width:min(95vw, 600px);
    height:55vh; 
    margin-top: 10px;
}

button{
    border:none;
    border-radius:30px;
    padding:15px 25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition: transform 0.2s ease, left 0.2s ease, top 0.2s ease; 
}

#btn-oui{
    background:#2ecc71;
    color:white;
    position:absolute;
    left:calc(50% - 70px); 
    top:50%;
    transform: translate(-50%, -50%);
    z-index: 5;
}

#btn-non{
    background:#e74c3c;
    color:white;
    position:absolute;
    left:calc(50% + 70px); 
    top:50%;
    transform: translate(-50%, -50%);
    z-index: 5;
}

#compteur{
    margin-top:10px;
    color:#555;
    font-size:16px;
}

/* Animation deuxième page */

.coeur{
    font-size:80px;
    animation:rebond 1s infinite alternate;
}

@keyframes rebond{

from{
transform:scale(1);
}

to{
transform:scale(1.2);
}

}

</style>
</head>

<body>

<div class="page" id="page1">

<h1>On part à Barcelone ? 🇪🇸</h1>

<!-- CORRECTION : Le bloc message a été déplacé ICI pour être au-dessus de la zone des boutons -->
<div id="message"></div>

<div class="zone" id="zone">

<button id="btn-oui">Oui🤫</button>
<button id="btn-non">Non😒</button>

</div>

</div>

<div class="page" id="page2">

<div class="coeur">🥳</div>

<h1>Enfin t'es arrivée ici !</h1>

<p>Prépare tes affaires on part du 22 au 25/09 ✈️</p>


</div>

<script>

const btnOui=document.getElementById("btn-oui");
const btnNon=document.getElementById("btn-non");
const zone=document.getElementById("zone");
const message=document.getElementById("message");

let tentatives=0;

function deplacerBouton(){

const marge=40; 

const maxX=zone.clientWidth-btnNon.offsetWidth;
const maxY=zone.clientHeight-btnNon.offsetHeight;

let x,y,collision=true;

const ouiX=btnOui.offsetLeft - (btnOui.offsetWidth / 2);
const ouiY=btnOui.offsetTop - (btnOui.offsetHeight / 2);

while(collision){

x=Math.random()*maxX;
y=Math.random()*maxY;

collision=
x < ouiX + btnOui.offsetWidth + marge &&
x + btnNon.offsetWidth > ouiX - marge &&
y < ouiY + btnOui.offsetHeight + marge &&
y + btnNon.offsetHeight > ouiY - marge;

}

btnNon.style.transform = "none"; 
btnNon.style.left=x+"px";
btnNon.style.top=y+"px";

const echelleNon = Math.max(0.4, 1 - tentatives * 0.05); 
btnNon.style.transform = `scale(${echelleNon})`;

}

function clicNon() {
    tentatives++;
    deplacerBouton();
    mettreAJourMessages();
}

btnNon.addEventListener("mouseenter", function() {
    tentatives++;
    deplacerBouton();
    mettreAJourMessages();
});

btnNon.addEventListener("touchstart", function(e){
    e.preventDefault();
    tentatives++;
    deplacerBouton();
    mettreAJourMessages();
});

btnNon.addEventListener("click", clicNon);

function mettreAJourMessages() {
    btnOui.style.transform=`translate(-50%, -50%) scale(${1+tentatives*0.05})`;

    if(tentatives===2) message.textContent="Tu hésites vraiment ?";
    if(tentatives===3) message.textContent="";
    if(tentatives===5) message.textContent="Je vais mal le prendre là 😳";
    if(tentatives===6) message.textContent="";
    if(tentatives===9) message.textContent="Tu ne l'auras jamais 😂";
    if(tentatives===10) message.textContent="";
    if(tentatives===12) message.textContent="Le bouton OUI est juste là... 👀";
    if(tentatives===13) message.textContent="";

    if(tentatives>=15){
        message.textContent="Je pense que tu n'as plus le choix 🤭"
        btnNon.style.display="none";
        message.style.display="block";
        btnOui.style.left="50%";
        btnOui.style.top="50%";
        btnOui.style.transform="translate(-50%, -50%) scale(1.8)";
    }
}

btnOui.addEventListener("click",function(){

document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="flex";

});

</script>

</body>
</html>
